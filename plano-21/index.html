<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Noite Silenciosa · Seu plano</title><meta name="robots" content="noindex"><meta name="theme-color" content="#101a2b"><style>
:root{--f:#101a2b;--t:#f4efe6;--s:#a9b4c4;--l:#2a3a55;--c:#172439;--d:#f0b35a}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--f);color:var(--t);font-size:17px;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding:16px 16px 90px}h1{font-size:26px;line-height:1.2;margin:4px 0 6px}h2{font-size:20px;margin:18px 0 8px}.s{color:var(--s);font-size:15px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}.dias button{aspect-ratio:1;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font-weight:800;font-size:16px}.dias button.on{outline:2px solid var(--d)}.dias button.ok{background:var(--d);color:#1a1408}
.ex{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}.ex h3{font-size:18px}.ex b{color:var(--d);font-size:15px}.ex ol{margin:8px 0 10px 20px}.ex li{margin:3px 0}
.b{display:block;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--d);color:#1a1408;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}.b.v{background:transparent;color:var(--t);border:2px solid var(--l)}
.ch{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}.ch input{width:24px;height:24px;accent-color:var(--d)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0c1422;border-top:1px solid var(--l);display:flex;justify-content:center}.nav div{max-width:480px;width:100%;display:flex}.nav button{flex:1;min-height:60px;background:none;border:0;color:var(--s);font:700 13px inherit}.nav button.on{color:var(--d)}
ul{margin:8px 0 0 18px}li{margin:6px 0}input[type=range]{width:100%;accent-color:var(--d);min-height:44px}.nota{font-size:32px;font-weight:800;color:var(--d)}
</style></head><body>
<div class="app" id="c"></div><div class="nav"><div><button type="button" data-a="plano">Plano</button><button type="button" data-a="diario">Diário</button><button type="button" data-a="negra">Lista Negra</button><button type="button" data-a="viagem">Viagem</button></div></div>
<script>
var EX={"varre": {"n": "Língua varre o céu", "r": "20 vezes", "p": ["Encoste a ponta da língua logo atrás dos dentes de cima.", "Deslize a língua para trás pelo céu da boca, sem soltar.", "Volte para a frente e repita."]}, "cola": {"n": "Língua colada", "r": "20 vezes", "p": ["Puxe a língua inteira para cima, como uma sucção.", "Cole toda a língua no céu da boca.", "Solte com força e repita."]}, "chao": {"n": "Língua no chão", "r": "20 vezes", "p": ["Mantenha a ponta da língua encostada nos dentes de baixo.", "Force o dorso da língua para baixo, contra o chão da boca.", "Relaxe e repita."]}, "a": {"n": "O A forte", "r": "20 vezes", "p": ["Abra a boca diante do espelho.", "Fale um A curto e forte.", "Veja o fundo da garganta e a úvula subirem a cada A."]}, "boch": {"n": "Bochecha contra o dedo", "r": "10 vezes em cada lado", "p": ["Lave as mãos e coloque um dedo dentro da boca, na bochecha.", "Empurre o dedo para fora com a força da bochecha.", "Solte e repita. Depois troque de lado."]}, "engole": {"n": "Engolir de língua alta", "r": "10 vezes", "p": ["Coloque a língua no céu da boca, com os dentes encostados.", "Engula a saliva sem mexer os lábios.", "Repita devagar."]}, "balao": {"n": "Balão pelo nariz", "r": "5 vezes", "p": ["Puxe o ar bem fundo pelo nariz.", "Sopre com força dentro de um balão, sem tirar da boca.", "Puxe o ar de novo pelo nariz e repita."]}, "mast": {"n": "Mastigar dos dois lados", "r": "Em todas as refeições", "p": ["Na refeição, mastigue um pouco de cada lado.", "Evite usar sempre o mesmo lado.", "Faça o dia inteiro, sem contar tempo."]}},SEM=[["Semana 1: acordar a musculatura", ["varre", "cola", "a"]], ["Semana 2: ganhar força", ["varre", "cola", "chao", "a", "boch"]], ["Semana 3: fixar o hábito", ["varre", "cola", "chao", "a", "boch", "engole", "balao"]]],NEGRA=["Bebida alcoólica nas 3 horas antes de dormir: afrouxa ainda mais a garganta.", "Remédio para dormir sem orientação médica: tem o mesmo efeito.", "Dormir de barriga para cima: a língua cai para trás.", "Jantar pesado perto da hora de deitar.", "Nariz entupido sem tratar: a pessoa passa a respirar pela boca.", "Cigarro: irrita e incha a garganta.", "Ganho de peso: aumenta a pressão sobre a passagem do ar."],VIAGEM=["Nos 3 dias antes da viagem, não pule nenhum treino.", "Na véspera, sem bebida alcoólica e sem jantar pesado.", "No ônibus ou no avião, evite dormir com a cabeça para trás: use apoio de pescoço e fique de lado.", "No quarto compartilhado, durma de lado com um travesseiro nas costas.", "Limpe o nariz com soro antes de deitar."];
var S={};try{S=JSON.parse(localStorage.getItem('ns21')||'{}')}catch(e){}
S.feito=S.feito||{};S.notas=S.notas||{};var dia=1,aba='plano';
function salva(){try{localStorage.setItem('ns21',JSON.stringify(S))}catch(e){}}
function sem(d){return Math.min(2,Math.floor((d-1)/7))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function plano(){var h='<h1>Dia '+dia+' de 21</h1><p class="s">'+SEM[sem(dia)][0]+' · cerca de 5 minutos</p><div class="dias">';
 for(var i=1;i<=21;i++)h+='<button type="button" data-d="'+i+'" class="'+(S.feito[i]?'ok ':'')+(i===dia?'on':'')+'">'+i+'</button>';
 h+='</div>';SEM[sem(dia)][1].forEach(function(k){var e=EX[k];h+='<div class="ex"><h3>'+esc(e.n)+'</h3><b>'+esc(e.r)+'</b><ol>'+e.p.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>'});
 var m=EX.mast;h+='<div class="ex"><h3>'+esc(m.n)+'</h3><b>'+esc(m.r)+'</b></div>';
 h+='<button type="button" class="b" id="feito">'+(S.feito[dia]?'Dia concluído ✓':'Marcar dia como feito')+'</button>';return h}
function diario(){var h='<h1>Diário do Ronco</h1><p class="s">Toda semana, peça para quem dorme ao lado dar uma nota de 0 a 10 para o barulho.</p>';
 [1,2,3].forEach(function(s){var n=S.notas[s];h+='<div class="ex"><h3>Semana '+s+'</h3><div class="nota" id="n'+s+'">'+(n==null?'–':n)+'</div><input type="range" min="0" max="10" step="1" value="'+(n==null?5:n)+'" data-s="'+s+'" aria-label="Nota da semana '+s+'"></div>'});return h}
function lista(t,a,l){return '<h1>'+t+'</h1><p class="s">'+a+'</p><div class="ex"><ul>'+l.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'}
function desenha(){var c=document.getElementById('c');c.innerHTML=aba==='plano'?plano():aba==='diario'?diario():aba==='negra'?lista('Lista Negra do Ronco','O que anula o treino à noite.',NEGRA):lista('Protocolo da Viagem','Como dormir fora sem passar vergonha.',VIAGEM);
 document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.a===aba)});
 c.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){dia=+b.dataset.d;desenha();scrollTo(0,0)}});
 var f=document.getElementById('feito');if(f)f.onclick=function(){S.feito[dia]=!S.feito[dia];salva();desenha()};
 c.querySelectorAll('input[type=range]').forEach(function(r){r.oninput=function(){S.notas[r.dataset.s]=+r.value;salva();document.getElementById('n'+r.dataset.s).textContent=r.value}})}
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){aba=b.dataset.a;desenha();scrollTo(0,0)}});
for(var i=1;i<=21;i++){if(!S.feito[i]){dia=i;break}}desenha();
</script></body></html>
